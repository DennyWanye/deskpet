# Dependabot configuration — weekly grouped PRs across all three package
# ecosystems. Grouping reduces PR noise (~5 PRs/week instead of ~30).
#
# Manual review is still required for:
#   - Major version bumps (auto-grouped under `major-updates` per ecosystem)
#   - PyTorch / CUDA toolchain (pinned for ABI stability — see backend/pyproject.toml)
#   - FlagEmbedding / transformers / peft (pinned together for BGE-M3 stability)
#
# Disable a single update line by deleting it; disable an ecosystem by
# removing its top-level entry.

version: 2
updates:
  # ─── Frontend (npm) ─────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/tauri-app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
        exclude-patterns:
          - "react"
          - "react-dom"
      major-updates:
        update-types:
          - "major"
    ignore:
      # pixi-live2d-display + pixi.js need coordinated upgrades — review manually
      - dependency-name: "pixi.js"
      - dependency-name: "pixi-live2d-display"
      # live2dcubismcore: upstream Live2D Inc. release; manual track per EULA
      - dependency-name: "live2dcubismcore"

  # ─── Rust (Cargo) ───────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/tauri-app/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
      major-updates:
        update-types:
          - "major"
    ignore:
      # tauri 2.x major bumps require careful review of breaking changes
      - dependency-name: "tauri"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tauri-build"
        update-types: ["version-update:semver-major"]

  # ─── Python (pip) ───────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
        exclude-patterns:
          - "torch*"
          - "FlagEmbedding"
          - "transformers"
          - "peft"
      major-updates:
        update-types:
          - "major"
    ignore:
      # PyTorch CUDA wheel pinning — manual upgrade only (ABI stability)
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "torchaudio"
      # FlagEmbedding family — Windows 3.11 ACCESS_VIOLATION at FE 1.4 + transformers 5
      # See backend/pyproject.toml comment around line 46
      - dependency-name: "FlagEmbedding"
      - dependency-name: "transformers"
      - dependency-name: "peft"

  # ─── GitHub Actions ─────────────────────────────────────────────────
  # Keep our own workflow actions current (actions/checkout, setup-python, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
