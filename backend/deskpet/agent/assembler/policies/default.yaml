# Default AssemblyPolicy for every canonical task_type (P4-S7 task 12.7).
#
# Loaded by deskpet/agent/assembler/policy.py::load_policies.
# User overrides live at %APPDATA%/deskpet/policies/overrides.yaml and
# are deep-merged on top (D9 decision):
#   - must         → user may ADD, never REMOVE core 'memory'
#   - prefer       → user replaces
#   - tools        → user replaces
#   - memory.*     → user deep-merges (override only l3_top_k if wanted)
#
# Components available in v1:
#   memory     — L1 snapshot + L2/L3 recall
#   tool       — filters ToolRegistry by 'tools' whitelist
#   skill      — skill prelude (P4-S10 wire-in)
#   persona    — pet persona / system preamble
#   time       — current time/date
#   workspace  — workspace directory summary
#
# 'tools: ["*"]' exposes every tool from the registry.
# 'tools: []'   exposes no tools that turn.
# Named list entries filter by tool name.
#
# ⚠️ IMPORTANT: the 'tool' component must appear in must/prefer for its
# slice (and thus the whitelist filter) to run. Policies with empty
# 'tools: []' (e.g. emotion) omit 'tool' from prefer so it doesn't emit
# an empty slice unnecessarily.
policies:

  chat:
    # FP-4 缺口 (2026-06-06 真机抓 bug)：``preference_profile`` 组件注册了却
    # **不在任何 policy 的 prefer 里** → 永不 fan-out → FP-4 偏好/画像注入
    # （WI-3.2）生产全局死掉（同 FP-5 skill 缺 policy 一类系统性 fanout-gating）。
    # 给对话/任务/code policy 补 preference_profile（flag persona_inject + 空-facts
    # 双门控 → flag 关或无 facts 时返回空 Slice，字节级 BC）。
    must: [memory, persona]
    prefer: [tool, time, workspace, preference_profile]
    tools: ["*"]
    memory:
      l1: snapshot
      l2_top_k: 5
      l2_page_in: always
      l3_top_k: 5
      relabel_l2: true
      anchor_current: true
      topic_shift_gate: false
      topic_shift_threshold: 0.35
      l2_keep_on_shift: 1
      topic_shift_min_len: 16

  recall:
    # Pure memory-probe: user asked "what did we discuss about X".
    # Give the LLM the widest possible memory window.
    must: [memory]
    prefer: [persona, tool, time, preference_profile]
    tools: [memory_read, memory_search]
    memory:
      l1: snapshot
      l2_top_k: 10
      l2_page_in: always
      l3_top_k: 10
      relabel_l2: true
      anchor_current: true
      topic_shift_gate: false
      topic_shift_threshold: 0.35
      l2_keep_on_shift: 1
      topic_shift_min_len: 16

  task:
    # "Do X for me" — actioned request. Full tool access + workspace.
    must: [memory, persona]
    prefer: [tool, skill, workspace, time, preference_profile]
    tools: ["*"]
    memory:
      l1: snapshot
      l2_top_k: 5
      l2_page_in: followup
      l3_top_k: 3
      relabel_l2: true
      anchor_current: true
      topic_shift_gate: false
      topic_shift_threshold: 0.35
      l2_keep_on_shift: 1
      topic_shift_min_len: 16

  code:
    # Coding/debugging — scoped tool list, workspace is high value.
    # 记忆系统升级 WI-M1.6：workspace_memory 组件注入本 session 文件
    # 工作记忆；workspace_recall 工具让 agent 主动查改过的文件。
    # FP-5 缺口 5e (2026-06-06 真机抓 bug)：原 prefer 漏 skill → code 会话
    # （/goal 所在、技能最该用的场景）SkillComponent 永不 fan-out → 自动披露
    # （WI-4.1/4.2）+ codify 造出的技能在 code 会话里永不被召回，与 FP-5 自相矛盾。
    # 补 skill（prefer = 可选 + 预算/flag 双门控，auto_disclosure 关时 desc-only BC）。
    must: [memory]
    prefer: [persona, tool, workspace, workspace_memory, skill, preference_profile]
    tools:
      - file_read
      - file_write
      - file_search
      - workspace_recall
      - todo_add
      - todo_list
    memory:
      l1: snapshot
      l2_top_k: 3
      l2_page_in: always
      l3_top_k: 5
      relabel_l2: true
      anchor_current: true
      topic_shift_gate: false
      topic_shift_threshold: 0.35
      l2_keep_on_shift: 1
      topic_shift_min_len: 16

  web_search:
    must: [memory]
    prefer: [persona, tool, time]
    tools: [web_search, web_fetch, web_crawl]
    memory:
      l1: snapshot
      l2_top_k: 2
      l2_page_in: followup
      l3_top_k: 3
      relabel_l2: true
      anchor_current: true
      topic_shift_gate: false
      topic_shift_threshold: 0.35
      l2_keep_on_shift: 1
      topic_shift_min_len: 16

  plan:
    must: [memory, persona]
    prefer: [tool, time, workspace, preference_profile]
    tools: [todo_add, todo_list, todo_update]
    memory:
      l1: snapshot
      l2_top_k: 3
      l2_page_in: always
      l3_top_k: 5
      relabel_l2: true
      anchor_current: true
      topic_shift_gate: false
      topic_shift_threshold: 0.35
      l2_keep_on_shift: 1
      topic_shift_min_len: 16

  emotion:
    # Emotional support — no tools, lean into persona + recent chat.
    must: [memory, persona]
    prefer: [time, preference_profile]
    tools: []
    memory:
      l1: snapshot
      l2_top_k: 5
      l2_page_in: always
      l3_top_k: 5
      relabel_l2: true
      anchor_current: true
      topic_shift_gate: false
      topic_shift_threshold: 0.35
      l2_keep_on_shift: 1
      topic_shift_min_len: 16

  command:
    # Slash command or direct control; tool-driven, skip heavy memory.
    must: [memory]
    prefer: [persona, tool]
    tools: ["*"]
    memory:
      l1: snapshot
      l2_top_k: 2
      l2_page_in: followup
      l3_top_k: 0
      relabel_l2: true
      anchor_current: true
      topic_shift_gate: false
      topic_shift_threshold: 0.35
      l2_keep_on_shift: 1
      topic_shift_min_len: 16
